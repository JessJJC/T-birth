<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday</title>
    <style>
      :root {
        --birthday-background: url("h.jpg");
        --text: #fff7f7;
        --soft: #ffe8ef;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 32px 20px;
        display: grid;
        place-items: center;
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
        background: var(--birthday-background) center / cover no-repeat fixed;
      }

      .card {
        position: relative;
        isolation: isolate;
        width: min(100%, 760px);
        padding: clamp(32px, 8vw, 76px);
        overflow: hidden;
        text-align: center;
        background: rgba(177, 74, 119, 0.88);
        border: 1px solid rgba(255, 255, 255, 0.65);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(15, 8, 24, 0.38),
          inset 0 0 0 8px rgba(255, 255, 255, 0.12);
      }

      .card::before,
      .card::after {
        position: absolute;
        z-index: -1;
        color: rgba(255, 255, 255, 0.25);
        font-family: sans-serif;
        pointer-events: none;
      }

      .card::before {
        content: "✦";
        top: 28px;
        left: 34px;
        font-size: 30px;
      }

      .card::after {
        content: "✧";
        right: 34px;
        bottom: 28px;
        font-size: 42px;
      }

      .cake {
        margin-bottom: 12px;
        font-size: 4rem;
      }

      h1 {
        margin: 0.2rem 0 0.8rem;
        font-size: clamp(2.4rem, 7vw, 4rem);
        font-weight: 400;
        letter-spacing: 0.08em;
        text-shadow: 0 3px 22px rgba(0, 0, 0, 0.35);
        text-transform: uppercase;
      }

      .birthday-image {
        display: block;
        width: min(100%, 480px);
        aspect-ratio: 16 / 9;
        margin: 28px auto;
        object-fit: cover;
        border: 2px solid rgba(255, 255, 255, 0.75);
        border-radius: 16px;
        box-shadow: 0 10px 28px rgba(15, 8, 24, 0.3);
      }

      .balloons {
        margin-top: 1.25rem;
        font-size: 2.4rem;
        letter-spacing: 0.5rem;
      }

      .video-link {
        display: inline-block;
        margin-top: 1.5rem;
        padding: 14px 30px;
        color: #49304f;
        background: #fff2d6;
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 999px;
        font: 700 0.9rem/1 Arial, sans-serif;
        letter-spacing: 0.06em;
        text-decoration: none;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }

      .video-link:hover {
        transform: translateY(-2px);
        background: #fff;
      }

      .video-link:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 4px;
      }

      .credit {
        margin: 32px 0 0;
        color: var(--soft);
        font: 0.85rem/1.5 Arial, Helvetica, sans-serif;
      }

      @media (max-width: 520px) {
        .card {
          border-radius: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="cake" aria-label="birthday cake">🎂</div>
      <h1>Happy Birthday Tosin !</h1>

      <img
        class="birthday-image"
        src="us.JPEG"
        alt="Birthday photo"
      />
      <div class="balloons" aria-label="balloons">🎈🎉🎁</div>
      <a class="video-link" href="https://youtu.be/zc52XfQEQtI" target="_blank" rel="noopener noreferrer">Click here for the amazing video🎬</a>
      <br>
      <a class="video-link" href="index.html"> Click to go back to birthday note</a>
      <p class="credit">Website coded by Jess :&gt;</p>
    </main>
  </body>
</html>
